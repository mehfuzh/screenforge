# Categories for GitHub's generated release notes ("Generate release notes" / generate_release_notes).
# Pull requests are grouped by label; unlabeled ones land under "Other changes".
changelog:
  exclude:
    labels: [skip-changelog, duplicate, invalid, wontfix, question]
    authors: [dependabot, github-actions]
  categories:
    - title: Breaking changes
      labels: [breaking change]
    - title: New features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug]
    - title: Recording and export
      labels: [recording, export]
    - title: Editor and UI
      labels: [editor, ui]
    - title: Documentation and site
      labels: [documentation, site]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
