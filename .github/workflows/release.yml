name: Release (macOS + Linux + Windows)
# Tag `vX.Y.Z` (or run manually / via "Cut release") → release build, Developer ID signing, DMG,
# notarization, stapling, GitHub Release with the downloadable app. Secrets, set by
# scripts/setup-release.sh --ci:
#   APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD  (Developer ID Application .p12)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (notarytool)
# Windows binaries and the installer are Authenticode-signed with Smartloop's Azure Trusted Signing
# account, like smartloop-ai/smartloop-studio: azure/login with GitHub OIDC (the "release"
# environment is the federated subject; no client secret). Secrets, set by
# scripts/setup-windows-signing.sh:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (github-smartloop-signing app)
#   AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE     (account endpoint, name, profile)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release'
        type: boolean
        default: false
      draft:
        description: 'Leave the release as a draft'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-26
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require signing secrets for published releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        env:
          C: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          I: ${{ secrets.APPLE_ID }}
          A: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$C" ] || missing="$missing APPLE_CERTIFICATE_BASE64"
          [ -n "$P" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "$I" ] || missing="$missing APPLE_ID"
          [ -n "$A" ] || missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "$T" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish an unsigned build. Missing secrets:$missing. Run scripts/setup-release.sh --ci on the Mac with the Developer ID certificate."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ffmpeg/ffprobe: static builds are downloaded by scripts/fetch-ffmpeg.sh inside bundle.sh
      - name: Import Apple code signing certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Resolve signing identity
        id: ident
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "Signing as: $ID"
      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: ${{ steps.ident.outputs.identity }}
        run: ./scripts/bundle.sh --release
      - name: Create DMG
        id: dmg
        env:
          CODESIGN_IDENTITY: ${{ steps.ident.outputs.identity }}
        run: echo "path=$(./scripts/dmg.sh)" >> "$GITHUB_OUTPUT"
      - name: Notarize and staple
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"
          xcrun stapler staple target/ScreenForge.app
          spctl -a -t open --context context:primary-signature -v "${{ steps.dmg.outputs.path }}" || true
      - name: Zip app and add stable-named copies (releases/latest/download/ScreenForge.dmg)
        run: |
          cd target
          ditto -c -k --keepParent ScreenForge.app ScreenForge-macOS.zip
          cp ScreenForge-*.dmg ScreenForge.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/*.dmg
            target/ScreenForge-macOS.zip
      - name: Release notes from commits
        # GitHub's generated notes only cover merged pull requests; this repo is mostly committed
        # to directly, so list the commits since the previous tag as well (user-facing subjects).
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}${{ github.ref_name }}
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            git log --format='- %s' "$RANGE" | grep -v -E '^- (Release [0-9]|Merge )' | head -60
            echo
          } > target/notes.md
          cat target/notes.md
      - name: GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.dmg
            target/ScreenForge-macOS.zip
          body_path: target/notes.md
          generate_release_notes: true
          draft: ${{ inputs.draft == true }}
          name: ScreenForge ${{ github.ref_name }}

  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxtst-dev \
            libxfixes-dev libxcb1-dev libxcb-xfixes0-dev libxdo-dev libpipewire-0.3-dev libclang-dev
      - name: Build .deb and .tar.gz
        run: ./scripts/bundle-linux.sh
        env:
          GH_TOKEN: ${{ github.token }}   # fetch-ffmpeg.sh looks up the newest static ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/screenforge_*.deb
            target/ScreenForge-*linux*.tar.gz

  windows:
    name: Build Windows package
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    # The OIDC token's subject is repo:mehfuzh/screenforge:environment:release, which is what the
    # federated credential on the github-smartloop-signing app registration matches.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require signing secrets for published releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        env:
          C: ${{ secrets.AZURE_CLIENT_ID }}
          T: ${{ secrets.AZURE_TENANT_ID }}
          S: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E: ${{ secrets.AZURE_TS_ENDPOINT }}
          A: ${{ secrets.AZURE_TS_ACCOUNT }}
          P: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          missing=""
          [ -n "$C" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$T" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$S" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$E" ] || missing="$missing AZURE_TS_ENDPOINT"
          [ -n "$A" ] || missing="$missing AZURE_TS_ACCOUNT"
          [ -n "$P" ] || missing="$missing AZURE_TS_PROFILE"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish an unsigned Windows build. Missing secrets:$missing. Run scripts/setup-windows-signing.sh."
            exit 1
          fi
      - name: Azure login (OIDC)
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The OIDC assertion azure/login exchanged is valid for ~5 minutes, but signing happens after
      # the Rust build. Fetch the code-signing token now so az caches it (~75 min) and the dlib's
      # AzureCliCredential gets a cache hit at sign time. See https://github.com/Azure/login/issues/180.
      - name: Pre-fetch Trusted Signing token
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none
      - name: Set up Azure Trusted Signing
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        env:
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          TSC="$RUNNER_TEMP/tsc"
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -ExcludeVersion -OutputDirectory "$(cygpath -w "$TSC")" >/dev/null
          DLIB=$(ls "$TSC"/Microsoft.Trusted.Signing.Client/bin/x64/Azure.CodeSigning.Dlib.dll)
          SIGNTOOL=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -1)
          # ExcludeCredentials: only the Azure CLI session from azure/login can mint a token here; the
          # managed-identity probe (169.254.169.254) hangs on hosted runners, so skip it.
          cat > "$TSC/metadata.json" <<JSON
          {
            "Endpoint": "$AZURE_TS_ENDPOINT",
            "CodeSigningAccountName": "$AZURE_TS_ACCOUNT",
            "CertificateProfileName": "$AZURE_TS_PROFILE",
            "ExcludeCredentials": [
              "EnvironmentCredential", "WorkloadIdentityCredential", "ManagedIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            ]
          }
          JSON
          { echo "SF_SIGNTOOL=$SIGNTOOL"; echo "SF_SIGN_DLIB=$DLIB"; echo "SF_SIGN_METADATA=$TSC/metadata.json"; } >> "$GITHUB_ENV"
          echo "signtool: $SIGNTOOL"
      - name: Build installer and .zip
        run: ./scripts/bundle-windows.sh
        env:
          GH_TOKEN: ${{ github.token }}   # fetch-ffmpeg.sh looks up the newest static ffmpeg
      - name: Verify signatures
        if: ${{ env.SF_SIGNTOOL != '' }}
        shell: pwsh
        run: |
          foreach ($f in 'target/windows/ScreenForge/screenforge.exe', 'target/ScreenForge-windows-x86_64-setup.exe') {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "${f}: $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$f signature is $($sig.Status), expected Valid" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/ScreenForge-*-windows-*.zip
            target/ScreenForge-windows-x86_64.zip
            target/ScreenForge-*-windows-*-setup.exe
            target/ScreenForge-windows-x86_64-setup.exe

  linux-publish:
    # after the macOS job has created the release, attach the Linux and Windows files to it
    name: Attach Linux and Windows packages to the release
    needs: [build, linux, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/*
            windows/*
          draft: ${{ inputs.draft == true }}
