name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/gen-releases.py"
      - "scripts/site_partials.py"
      - "scripts/site/**"
      - ".github/workflows/site.yml"
  # the release workflow starts this once a release is published (a release it creates with
  # GITHUB_TOKEN does not trigger `release` events); `release` covers ones published by hand
  release:
    types: [published]
  workflow_dispatch:

# one deploy at a time; a newer one replaces a queued one
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the Cloudflare token is configured
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN secret not set; see scripts/deploy-site.sh. Nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes pages from the GitHub releases
        if: ${{ env.CF_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen-releases.py
      - name: Shared footer on every page
        if: ${{ env.CF_TOKEN != '' }}
        run: python3 scripts/site_partials.py
      - name: Deploy site/ to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=screenforge --branch=main
