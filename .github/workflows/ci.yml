name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config ffmpeg libgtk-3-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxtst-dev \
            libxfixes-dev libxcb1-dev libxcb-xfixes0-dev libxdo-dev libpulse-dev libpipewire-0.3-dev libclang-dev
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Linux packages (.deb + .tar.gz)
        run: ./scripts/bundle-linux.sh
        env:
          GH_TOKEN: ${{ github.token }}   # fetch-ffmpeg.sh looks up the newest static ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/screenforge_amd64.deb
            target/ScreenForge-linux-x86_64.tar.gz

  windows:
    name: Build & test (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      # bindgen (whisper-rs) needs libclang; the runners ship LLVM
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg for the tests
        run: |
          DIR=$(./scripts/fetch-ffmpeg.sh)
          echo "SF_FFMPEG=$PWD/$DIR/ffmpeg.exe" >> "$GITHUB_ENV"
          echo "SF_FFPROBE=$PWD/$DIR/ffprobe.exe" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Windows package (.zip)
        run: ./scripts/bundle-windows.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/ScreenForge-windows-x86_64.zip
            target/ScreenForge-windows-x86_64-setup.exe
