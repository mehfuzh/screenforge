name: Cut release
# Actions tab → "Cut release" → Run workflow with a version. Bumps Cargo.toml, commits, tags
# vX.Y.Z, then starts the release workflow (release.yml) for that tag, which builds, signs/notarizes (when the
# Apple secrets exist), and publishes the GitHub Release with generated notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, without the v)'
        required: true
        type: string
      draft:
        description: 'Leave the GitHub Release as a draft for review'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z"; exit 1; }
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then echo "tag v${{ inputs.version }} already exists"; exit 1; fi
      - name: Bump workspace version
        run: |
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "${{ inputs.version }}"/' Cargo.toml
          grep -q '^version = "${{ inputs.version }}"' Cargo.toml
          # keep Cargo.lock in sync without touching dependency versions
          cargo update --workspace --offline 2>/dev/null || cargo update --workspace
      - name: Commit and tag
        run: |
          git config user.name "Mehfuz Hossain"
          git config user.email "mehfuz@smartloop.ai"
          git add Cargo.toml Cargo.lock
          # no commit when the version was already set (re-releasing the same number)
          git diff --cached --quiet || git commit -m "Release ${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "ScreenForge ${{ inputs.version }}"
          git push origin HEAD:main "v${{ inputs.version }}"
      - name: Start the release build
        # tags pushed with GITHUB_TOKEN do not trigger other workflows, so start it explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ inputs.version }}" -f publish=true -f draft=${{ inputs.draft }}
      - name: Summary
        run: |
          echo "Tagged v${{ inputs.version }}. Follow the build under Actions → Release (macOS + Linux)." >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
