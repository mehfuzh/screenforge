<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#211a2c"/>
      <stop offset="1" stop-color="#0b0a11"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.4" stop-color="#ff8a45"/>
      <stop offset="0.75" stop-color="#ff4a5c"/>
      <stop offset="1" stop-color="#c81f78"/>
    </linearGradient>
    <radialGradient id="dot" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff6ee"/>
      <stop offset="1" stop-color="#ffd6c2"/>
    </radialGradient>
  </defs>
  <rect x="100" y="118" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="590" r="260" fill="#ff5a4a" opacity="0.4" filter="url(#glow)"/>
    <!-- ring whose top rises into a single flame tongue -->
    <path fill="url(#fire)" fill-rule="evenodd" d="
      M512 214
      C548 282 610 322 650 356
      C716 404 760 482 760 590
      A248 248 0 1 1 264 590
      C264 482 308 404 374 356
      C414 322 476 282 512 214 Z
      M512 412 A178 178 0 1 0 512.1 412 Z"/>
    <circle cx="512" cy="590" r="179" fill="#140f1a"/>
    <circle cx="512" cy="590" r="104" fill="url(#dot)"/>
  </g>
</svg>
