<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#211a2c"/>
      <stop offset="1" stop-color="#0b0a11"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.4" stop-color="#ff8a45"/>
      <stop offset="0.75" stop-color="#ff4a5c"/>
      <stop offset="1" stop-color="#c81f78"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.45" stop-color="#ff8a45"/>
      <stop offset="1" stop-color="#ff4a5c"/>
    </linearGradient>
  </defs>
  <rect x="100" y="118" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- a window: fire body, dark title bar with traffic lights, fire outline so the bar reads on the dark tile;
         scaled to ~65% of the tile so it has the same breathing room as the system icons -->
    <g transform="translate(512 512) scale(0.8) translate(-512 -512)">
    <rect x="172" y="262" width="680" height="500" rx="96" fill="url(#fire)"/>
    <path fill="#140f1a" d="M268 262 H756 A96 96 0 0 1 852 358 V398 H172 V358 A96 96 0 0 1 268 262 Z"/>
    <rect x="172" y="262" width="680" height="500" rx="96" fill="none" stroke="url(#fire)" stroke-width="40"/>
    <circle cx="264" cy="330" r="26" fill="url(#dot)"/>
    <circle cx="342" cy="330" r="26" fill="url(#dot)"/>
    <circle cx="420" cy="330" r="26" fill="url(#dot)"/>
    <!-- record dot -->
    <circle cx="512" cy="580" r="132" fill="#140f1a"/>
    <circle cx="512" cy="580" r="76" fill="url(#dot)"/>
    </g>
  </g>
</svg>
