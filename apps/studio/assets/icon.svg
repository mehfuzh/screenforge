<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="well-clip"><circle cx="512" cy="512" r="316"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2236"/>
      <stop offset="1" stop-color="#120e18"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d0a12"/>
      <stop offset="1" stop-color="#1a1322"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.45" stop-color="#ff8a45"/>
      <stop offset="1" stop-color="#ff4a5c"/>
    </linearGradient>
  </defs>
  <rect x="100" y="118" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the mark: a round inset lens (dark well, inner shadow at the top, light bezel edge) with a record dot.
       It is a circle so the same artwork works as a circle-cropped avatar. -->
  <circle cx="512" cy="512" r="316" fill="url(#well)"/>
  <g clip-path="url(#well-clip)"><rect x="196" y="156" width="632" height="90" fill="#000" opacity="0.55" filter="url(#inner)"/></g>
  <circle cx="512" cy="512" r="316" fill="none" stroke="url(#bezel)" stroke-width="6"/>
  <circle cx="512" cy="512" r="321" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="6"/>
  <circle cx="512" cy="524" r="187" fill="#ff5a4a" opacity="0.35" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="150" fill="url(#dot)"/>
</svg>
