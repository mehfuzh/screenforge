[package]
name = "studio"
description = "ScreenForge desktop app: recorder, editor, exporter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "screenforge"
path = "src/main.rs"

[dependencies]
sf-project.workspace = true
sf-engine.workspace = true
sf-media.workspace = true
sf-render.workspace = true
sf-session.workspace = true
sf-export.workspace = true
sf-license.workspace = true
sf-recording.workspace = true
sf-transcribe.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
wgpu.workspace = true
rfd.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
cpal = "0.18"
muda = "0.21"
image.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# winit needs a windowing backend on Linux
eframe = { workspace = true, features = ["x11", "wayland"] }
# the toolbar's input region (clicks pass through its transparent part)
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSFileManager", "NSURL", "NSError", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSView", "NSVisualEffectView", "NSGraphics", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSMenu", "NSCell", "NSRunningApplication", "NSWorkspace"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
tempfile = "3"
